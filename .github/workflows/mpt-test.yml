name: MoneyPrinterTurbo Isolated Test - No Music + Arabic Subtitles

# تجربة منفصلة بلا موسيقى: لا ترفع شيئًا إلى YouTube ولا تلمس main.py أو ملفات الذاكرة.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mpt-isolated-test-arabic
  cancel-in-progress: false

jobs:
  generate-test-video:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check required Pexels secret
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          if [ -z "$PEXELS_API_KEY" ]; then
            echo "::error::Missing repository secret PEXELS_API_KEY"
            exit 1
          fi
          echo "PEXELS_API_KEY: present (value hidden)"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg git curl imagemagick fonts-noto-core fonts-noto-extra fontconfig
          fc-cache -f

      - name: Clone official MoneyPrinterTurbo (no unofficial PyPI package)
        run: |
          set -euo pipefail
          # نحاول النسخة v1.3.9، وإن لم توجد نستخدم الفرع الرئيسي.
          if ! git clone --depth 1 --branch v1.3.9 https://github.com/harry0703/MoneyPrinterTurbo.git "$RUNNER_TEMP/mpt"; then
            echo "Tag v1.3.9 not found; using default branch."
            rm -rf "$RUNNER_TEMP/mpt"
            git clone --depth 1 https://github.com/harry0703/MoneyPrinterTurbo.git "$RUNNER_TEMP/mpt"
          fi
          echo "MPT_DIR=$RUNNER_TEMP/mpt" >> "$GITHUB_ENV"
          ls "$RUNNER_TEMP/mpt"

      - name: Install MoneyPrinterTurbo dependencies
        run: |
          set -euo pipefail
          cd "$MPT_DIR"
          python -m pip install --upgrade pip uv
          if uv sync --frozen; then
            # Store the interpreter path, not the multi-word command "uv run python".
            if [ ! -x .venv/bin/python ]; then
              echo "::error::uv sync completed but .venv/bin/python was not created"
              exit 1
            fi
            echo "RUN_PY=$MPT_DIR/.venv/bin/python" >> "$GITHUB_ENV"
          else
            echo "uv sync failed; falling back to venv + requirements.txt"
            python -m venv .venv
            .venv/bin/pip install -r requirements.txt
            echo "RUN_PY=$MPT_DIR/.venv/bin/python" >> "$GITHUB_ENV"
          fi

      - name: Install Arabic shaping support and prepare Arabic font
        run: |
          set -euo pipefail
          cd "$MPT_DIR"

          mkdir -p resource/fonts
          FONT_SOURCE="$(find /usr/share/fonts -type f -iname 'NotoSansArabic-Regular.ttf' | head -n1)"
          if [ -z "$FONT_SOURCE" ]; then
            FONT_SOURCE="$(fc-match -f '%{file}' 'Noto Sans Arabic:style=Regular' | head -n1)"
          fi
          if [ -z "$FONT_SOURCE" ] || [ ! -f "$FONT_SOURCE" ]; then
            echo "::error::Noto Sans Arabic font was not found"
            exit 1
          fi
          cp "$FONT_SOURCE" resource/fonts/NotoSansArabic-Regular.ttf
          echo "Arabic subtitle font: $FONT_SOURCE"

          # uv-created virtual environments do not necessarily contain pip.
          # Install into the project's interpreter through uv, without relying on python -m pip.
          if [ ! -x .venv/bin/python ]; then
            echo "::error::MoneyPrinterTurbo virtual-environment Python was not found"
            exit 1
          fi
          uv pip install --python .venv/bin/python arabic-reshaper python-bidi
          .venv/bin/python -c "import arabic_reshaper; from bidi.algorithm import get_display; print('Arabic shaping packages: installed')"

          python - <<'PY_PATCH'
          from pathlib import Path

          path = Path("app/services/video.py")
          source = path.read_text(encoding="utf-8")

          import_line = "from PIL import Image, ImageColor, ImageDraw, ImageFont, ImageOps\n"
          import_patch = import_line + "import arabic_reshaper\nfrom bidi.algorithm import get_display\n"
          if "import arabic_reshaper" not in source:
              if source.count(import_line) != 1:
                  raise SystemExit("Could not safely locate Pillow imports in video.py")
              source = source.replace(import_line, import_patch, 1)

          helper_anchor = "from app.utils import file_security, logging_utils, utils\n"
          helper_lines = [
              "",
              "",
              "def _shape_arabic_subtitle_text(text: str) -> str:",
              "    # Shape Arabic glyphs and apply bidi ordering for subtitle rendering.",
              '    output_lines = []',
              '    for line in str(text or "").split("\\n"): ',
              '        if any("\\u0600" <= char <= "\\u06ff" or "\\ufb50" <= char <= "\\ufdff" or "\\ufe70" <= char <= "\\ufeff" for char in line):',
              '            line = get_display(arabic_reshaper.reshape(line))',
              '        output_lines.append(line)',
              '    return "\\n".join(output_lines)',
              "",
          ]
          helper = helper_anchor + "\n".join(helper_lines) + "\n"
          if "def _shape_arabic_subtitle_text" not in source:
              if source.count(helper_anchor) != 1:
                  raise SystemExit("Could not safely locate helper insertion point")
              source = source.replace(helper_anchor, helper, 1)

          # Shape Arabic exactly once, at the final TextClip rendering boundary.
          # Do not reshape wrapped_txt: the previous workflow shaped twice and
          # produced reversed/disconnected glyphs.
          old_factory = '''        def make_textclip(text):
                      return TextClip(
                          text=text,
          '''
          new_factory = '''        def make_textclip(text):
                      return TextClip(
                          text=_shape_arabic_subtitle_text(text),
          '''
          if "text=_shape_arabic_subtitle_text(text)" not in source:
              if source.count(old_factory) != 1:
                  raise SystemExit("Could not safely patch subtitle clip factory")
              source = source.replace(old_factory, new_factory, 1)

          if source.count("text=_shape_arabic_subtitle_text(text)") != 1:
              raise SystemExit("Expected exactly one Arabic shaping call at final rendering")
          if "wrapped_txt = _shape_arabic_subtitle_text(wrapped_txt)" in source:
              raise SystemExit("Unexpected early Arabic shaping call detected")

          path.write_text(source, encoding="utf-8")
          print("Arabic subtitle shaping patch applied")
          PY_PATCH

          "$RUN_PY" - <<'PY_CHECK'
          from pathlib import Path
          import unicodedata
          import arabic_reshaper
          from bidi.algorithm import get_display
          from PIL import ImageFont

          font_path = Path("resource/fonts/NotoSansArabic-Regular.ttf")
          if not font_path.is_file():
              raise SystemExit("Arabic font file is missing")
          sample = "كيف يعمل صمام المحرك وما دوره في دخول الهواء وخروج العادم؟"
          rendered = get_display(arabic_reshaper.reshape(sample))
          font = ImageFont.truetype(str(font_path), 64)
          missing = font.getmask("\U0010ffff")
          missing_signature = (missing.size, missing.getbbox(), bytes(missing))
          for char in rendered:
              if unicodedata.category(char)[0] not in {"L", "N"}:
                  continue
              mask = font.getmask(char)
              signature = (mask.size, mask.getbbox(), bytes(mask))
              if mask.getbbox() is None or signature == missing_signature:
                  raise SystemExit(f"Arabic font is missing glyph: U+{ord(char):04X}")
          print("Arabic font and shaping preflight: PASS")
          print("Rendered sample (visual order):", rendered)
          PY_CHECK

      - name: Show real CLI options (diagnostic)
        run: |
          set -euo pipefail
          cd "$MPT_DIR"
          $RUN_PY cli.py --help 2>&1 | tee "$RUNNER_TEMP/mpt-cli-help.txt"

      - name: Install Ollama and pull model
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh

          if ! curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then
            nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          fi

          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null

          MODEL="qwen3:4b-instruct"
          if ! ollama pull "$MODEL"; then
            echo "Could not pull $MODEL; trying qwen3:4b"
            MODEL="qwen3:4b"
            ollama pull "$MODEL"
          fi
          echo "OLLAMA_MODEL=$MODEL" >> "$GITHUB_ENV"
          ollama list

      - name: Quick Arabic check of the local model
        run: |
          set -euo pipefail
          timeout 300 ollama run "$OLLAMA_MODEL" "اكتب جملة عربية قصيرة عن صمام المحرك." || echo "::warning::Ollama quick check did not finish"

      - name: Configure MoneyPrinterTurbo
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          set -euo pipefail
          cd "$MPT_DIR"
          cp config.example.toml config.toml

          python - <<'PY'
          import os, re, tomllib
          from pathlib import Path

          path = Path("config.toml")
          text = path.read_text(encoding="utf-8")

          settings = {
              "video_source": '"pexels"',
              "pexels_api_keys": '["' + os.environ["PEXELS_API_KEY"] + '"]',
              "llm_provider": '"ollama"',
              "ollama_base_url": '"http://127.0.0.1:11434/v1"',
              "ollama_model_name": '"' + os.environ["OLLAMA_MODEL"] + '"',
              "subtitle_provider": '"edge"',
          }

          for key, value in settings.items():
              pattern = re.compile(r"^[ \t]*#?[ \t]*" + re.escape(key) + r"[ \t]*=.*$", re.M)
              line = f"{key} = {value}"
              if pattern.search(text):
                  text = pattern.sub(lambda m: line, text, count=1)
              elif re.search(r"^\[app\][ \t]*$", text, re.M):
                  text = re.sub(r"^\[app\][ \t]*$", lambda m: "[app]\n" + line, text, count=1, flags=re.M)
              else:
                  text += "\n[app]\n" + line + "\n"

          path.write_text(text, encoding="utf-8")

          app = tomllib.loads(text).get("app", {})
          for key in ("video_source", "llm_provider", "ollama_model_name", "subtitle_provider"):
              print(f"{key}: {app.get(key)}")
          if not app.get("pexels_api_keys"):
              raise SystemExit("Configuration check failed: no Pexels key loaded")
          print("pexels_api_keys: present (value hidden)")
          PY

      - name: Generate one Arabic automotive-mechanics test video
        run: |
          set -uo pipefail
          cd "$MPT_DIR"

          # Use a reviewed Arabic script instead of asking the small local model
          # to write Arabic. This isolates subtitle rendering from script quality.
          ARABIC_SCRIPT="تعمل صمامات المحرك على تنظيم دخول الهواء وخروج غازات العادم من الأسطوانات. في شوط السحب، يفتح صمام السحب ويدخل الهواء إلى الأسطوانة. ثم يُغلق الصمام أثناء شوطَي الضغط والقدرة. وبعد انتهاء الاحتراق، يفتح صمام العادم خلال شوط العادم، فيدفع المكبس الغازات المحترقة إلى خارج الأسطوانة. ويتحكم عمود الكامات في توقيت فتح الصمامات وإغلاقها، لضمان عمل المحرك بكفاءة."
          ARGS=( --video-script "$ARABIC_SCRIPT" )

          # نضيف الخيارات فقط إذا كانت موجودة فعلًا في --help، حتى لا نفشل بسبب خيار غير موجود.
          HELP="$RUNNER_TEMP/mpt-cli-help.txt"
          if grep -q -- "--video-language" "$HELP"; then ARGS+=( --video-language "ar-SA" ); else echo "::warning::--video-language not available"; fi
          if grep -q -- "--voice-name" "$HELP"; then ARGS+=( --voice-name "ar-SA-HamedNeural" ); else echo "::warning::--voice-name not available"; fi
          if grep -q -- "--font-name" "$HELP"; then ARGS+=( --font-name "NotoSansArabic-Regular.ttf" ); else echo "::error::--font-name is unavailable"; exit 1; fi
          if grep -q -- "--subtitle-display-mode" "$HELP"; then ARGS+=( --subtitle-display-mode sentence ); else echo "::error::--subtitle-display-mode is unavailable"; exit 1; fi
          if ! grep -q -- "--video-script" "$HELP"; then echo "::error::--video-script is unavailable"; exit 1; fi
          if grep -q -- "--video-aspect" "$HELP"; then ARGS+=( --video-aspect "9:16" ); fi
          if grep -q -- "--video-count" "$HELP"; then ARGS+=( --video-count 1 ); fi

          # إيقاف الموسيقى الخلفية صراحةً؛ الوضع الافتراضي في MoneyPrinterTurbo هو random.
          if ! grep -q -- "--bgm-type" "$HELP"; then
            echo "::error::This MoneyPrinterTurbo build does not expose --bgm-type; refusing to generate a video that may contain music."
            exit 1
          fi
          ARGS+=( --bgm-type none )
          if grep -q -- "--bgm-volume" "$HELP"; then ARGS+=( --bgm-volume 0 ); fi

          echo "Arguments used: ${ARGS[*]}"
          echo "Background music policy: DISABLED (bgm-type=none, bgm-volume=0)"
          $RUN_PY cli.py "${ARGS[@]}" 2>&1 | tee "$RUNNER_TEMP/mpt-generation.log"
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -ne 0 ]; then
            echo "::error::cli.py exited with code $STATUS"
            exit "$STATUS"
          fi

      - name: Locate and validate generated video
        id: validate_video
        run: |
          set -euo pipefail
          cd "$MPT_DIR"

          # نفضّل الملف النهائي final-*.mp4 إن وُجد، وإلا أحدث mp4.
          VIDEO="$(find storage -type f -iname 'final-*.mp4' -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -n1 | cut -d' ' -f2- || true)"
          if [ -z "$VIDEO" ]; then
            VIDEO="$(find storage -type f -iname '*.mp4' -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -n1 | cut -d' ' -f2- || true)"
          fi

          if [ -z "$VIDEO" ] || [ ! -s "$VIDEO" ]; then
            echo "::error::No MP4 file was produced"
            find storage -maxdepth 5 -type f 2>/dev/null | head -100 || true
            exit 1
          fi
          VIDEO="$MPT_DIR/$VIDEO"

          DURATION="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$VIDEO")"
          DIMENSIONS="$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$VIDEO")"
          AUDIO_STREAMS="$(ffprobe -v error -select_streams a -show_entries stream=index -of csv=p=0 "$VIDEO")"

          echo "Video: $VIDEO"
          echo "Duration: ${DURATION}s"
          echo "Dimensions: ${DIMENSIONS}"
          if [ -z "$AUDIO_STREAMS" ]; then
            echo "::error::Generated video has no audio stream"
            exit 1
          fi
          echo "Audio stream: present"

          python - "$DURATION" "$DIMENSIONS" <<'PY'
          import sys
          duration = float(sys.argv[1])
          width, height = (int(v) for v in sys.argv[2].split("x", 1))
          if duration < 5:
              raise SystemExit("Video is too short")
          if height <= width:
              raise SystemExit("Video is not portrait")
          PY

          echo "video_path=$VIDEO" >> "$GITHUB_OUTPUT"

      - name: Upload test video for manual review (no YouTube upload)
        uses: actions/upload-artifact@v4
        with:
          name: mpt-isolated-test-${{ github.run_number }}
          path: ${{ steps.validate_video.outputs.video_path }}
          if-no-files-found: error
          retention-days: 1

      - name: Upload diagnostics if the test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mpt-test-diagnostics-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/ollama.log
            ${{ runner.temp }}/mpt-cli-help.txt
            ${{ runner.temp }}/mpt-generation.log
          if-no-files-found: ignore
          retention-days: 1
