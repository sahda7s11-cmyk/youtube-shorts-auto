name: Daily YouTube Short

on:
  schedule:
    # 5:00 PM Saudi Arabia time (UTC+3)
    - cron: "0 14 * * *"

    # 10:00 PM Saudi Arabia time (UTC+3)
    - cron: "0 19 * * *"

  workflow_dispatch:

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run YouTube Shorts automation
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python main.py

      - name: Verify generated video
        run: |
          if [ ! -f "short.mp4" ]; then
            echo "ERROR: short.mp4 was not created."
            exit 1
          fi

          echo "Video created successfully:"
          ls -lh short.mp4

          echo "Video information:"
          ffprobe -v error \
            -show_entries stream=width,height,codec_name \
            -show_entries format=duration \
            -of default=noprint_wrappers=1 \
            short.mp4

      - name: Save generated Short
        uses: actions/upload-artifact@v4
        with:
          name: generated-short-${{ github.run_number }}
          path: short.mp4
          if-no-files-found: error
