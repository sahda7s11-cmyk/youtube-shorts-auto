name: Daily YouTube Short

permissions:
  contents: write

concurrency:
  group: youtube-shorts-automation
  cancel-in-progress: false

on:
  schedule:
    # 5:00 PM Saudi Arabia time (UTC+3)
    - cron: "0 14 * * *"

    # 10:00 PM Saudi Arabia time (UTC+3)
    - cron: "0 19 * * *"

  workflow_dispatch:

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest

    steps:
      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =====================================================
      # PYTHON
      # =====================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # =====================================================
      # FFMPEG
      # =====================================================

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # =====================================================
      # DEPENDENCIES
      # =====================================================

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # =====================================================
      # RUN AUTOMATION
      # =====================================================

      - name: Run YouTube Shorts automation
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python main.py

      # =====================================================
      # VERIFY VIDEO
      # =====================================================

      - name: Verify generated video
        run: |
          if [ ! -f "short.mp4" ]; then
            echo "ERROR: short.mp4 was not created."
            exit 1
          fi

          echo "Video created successfully:"
          ls -lh short.mp4

          echo "Video information:"
          ffprobe -v error \
            -show_entries stream=width,height,codec_name \
            -show_entries format=duration \
            -of default=noprint_wrappers=1 \
            short.mp4

      # =====================================================
      # SAVE MEMORY
      # =====================================================

      - name: Save content and clips memory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Checking memory files..."

          if [ -f "used_pexels.json" ]; then
            echo "used_pexels.json found."
          else
            echo "WARNING: used_pexels.json not found."
          fi

          if [ -f "used_content.json" ]; then
            echo "used_content.json found."
          else
            echo "WARNING: used_content.json not found."
          fi

          git add used_pexels.json used_content.json

          if git diff --cached --quiet; then
            echo "No memory changes to save."
          else
            echo "Memory changes detected."

            git commit -m "Update Shorts content memory"

            git push

            echo "Memory successfully saved to repository."
          fi

      # =====================================================
      # SAVE GENERATED SHORT
      # =====================================================

      - name: Save generated Short
        uses: actions/upload-artifact@v4
        with:
          name: generated-short-${{ github.run_number }}
          path: short.mp4
          if-no-files-found: error
