          #!/usr/bin/env python3
          """يدمج ذاكرة هذا التشغيل مع أحدث نسخة من GitHub دون حذف أي سجل.

          الاستعمال:  python mpt_daily/merge_memory.py GENERATED_DIR
          (يُنفَّذ من جذر المستودع بعد git reset --hard origin/main)
          """
          import json
          import sys
          from pathlib import Path

          FILES = ("used_content.json", "used_pexels.json")


          def load_list(path):
              if not path.exists():
                  return []
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  print(f"WARNING: could not read {path}; treating as empty")
                  return []
              return data if isinstance(data, list) else []


          def key(item):
              try:
                  return json.dumps(item, ensure_ascii=False, sort_keys=True, separators=(",", ":"))
              except Exception:
                  return repr(item)


          def main():
              if len(sys.argv) != 2:
                  print(__doc__)
                  return 2
              generated_dir = Path(sys.argv[1])
              for name in FILES:
                  generated = generated_dir / name
                  if not generated.exists():
                      print(f"{name}: nothing to merge")
                      continue
                  remote = load_list(Path(name))
                  merged, seen = [], set()
                  for item in remote + load_list(generated):
                      k = key(item)
                      if k not in seen:
                          seen.add(k)
                          merged.append(item)
                  Path(name).write_text(json.dumps(merged, ensure_ascii=False, indent=2) + "\n",
                                        encoding="utf-8")
                  print(f"{name}: remote {len(remote)} + generated -> {len(merged)} records")
              return 0


          if __name__ == "__main__":
              sys.exit(main())
