name: Daily MPT Short

# ملف واحد يحتوي كل شيء (السكربتات والمواضيع مدمجة). لا تحتاج مجلد mpt_daily.
# النظام الجديد: MoneyPrinterTurbo + فحص جودة + رفع YouTube.
# عطّل workflow القديم (Daily YouTube Short) من تبويب Actions حتى لا ينشر الاثنان معًا.

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      privacy:
        description: "none = تجربة بدون رفع | private | unlisted | public"
        type: choice
        default: none
        options:
          - none
          - private
          - unlisted
          - public
      topic_id:
        description: "اختياري: رقم موضوع محدد من topics.json (مثل valve-001)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: youtube-shorts-automation
  cancel-in-progress: false

env:
  # التشغيل المجدول يستخدم المتغير YT_PRIVACY إن وُجد (Settings > Variables)، وإلا private.
  PRIVACY: ${{ github.event.inputs.privacy || vars.YT_PRIVACY || 'private' }}

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pipeline files (embedded)
        run: |
          set -euo pipefail
          mkdir -p mpt_daily
          cat > mpt_daily/run_daily.py <<'PYEOF_RUN_DAILY'
          #!/usr/bin/env python3
          """المنسّق اليومي للنظام الجديد.

          الترتيب:
            1. اختيار موضوع لم يُنتج من قبل (من topics.json مقابل used_content.json)
            2. إنتاج الفيديو بواسطة MoneyPrinterTurbo (حتى 3 محاولات)
            3. فحص الجودة (check_video.py) - إذا فشل لا يُنشر شيء
            4. الرفع إلى YouTube حسب PRIVACY: private | unlisted | public | none
               (none = تجربة بدون رفع ولا حفظ ذاكرة)
            5. حفظ الموضوع ومعرّف الفيديو في used_content.json
               وحفظ معرّفات مقاطع Pexels في used_pexels.json

          متغيرات البيئة المطلوبة:
            MPT_DIR, RUN_PY            (يضبطها الـ workflow)
            PRIVACY                    (الافتراضي private)
            FORCE_TOPIC_ID             (اختياري: لتجربة موضوع محدد)
            YOUTUBE_CLIENT_ID, YOUTUBE_CLIENT_SECRET, YOUTUBE_REFRESH_TOKEN
                                       (مطلوبة فقط عند الرفع)
          لا يطبع هذا السكربت أي قيمة سرية.
          """
          import json
          import os
          import re
          import shutil
          import subprocess
          import sys
          import time
          from pathlib import Path

          HERE = Path(__file__).resolve().parent
          ROOT = HERE.parent
          sys.path.insert(0, str(HERE))
          import check_video  # noqa: E402

          TOPICS_FILE = HERE / "topics.json"
          USED_CONTENT = ROOT / "used_content.json"
          USED_PEXELS = ROOT / "used_pexels.json"
          REVIEW_DIR = ROOT / "review"
          OUTPUT_DIR = ROOT / "output"
          MAX_ATTEMPTS = 3
          GENERATION_TIMEOUT = 40 * 60
          VALID_PRIVACY = ("private", "unlisted", "public", "none")

          REQUIRED_CLI_FLAGS = [
              "--video-script", "--video-terms", "--video-language", "--voice-name",
              "--font-name", "--subtitle-display-mode", "--video-aspect",
              "--video-count", "--bgm-type", "--bgm-volume",
          ]


          # ----------------------------------------------------------------- helpers
          def norm(text):
              text = re.sub(r"[\u064B-\u065F\u0670\u0640]", "", str(text or ""))  # التشكيل والتطويل
              text = re.sub(r"[^\w\s]", " ", text, flags=re.UNICODE)
              return re.sub(r"\s+", " ", text).strip().lower()


          def load_list(path):
              if not path.exists():
                  return []
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  print(f"WARNING: could not read {path.name}; treating as empty")
                  return []
              return data if isinstance(data, list) else []


          def write_json_atomic(path, data):
              tmp = path.with_suffix(path.suffix + ".tmp")
              tmp.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
              tmp.replace(path)


          # ------------------------------------------------------------------ topics
          def pick_topic(topics, used_records, forced_id=None):
              if forced_id:
                  for t in topics:
                      if t["id"] == forced_id:
                          print(f"FORCE_TOPIC_ID={forced_id}: skipping the used-topic check")
                          return t
                  raise SystemExit(f"FORCE_TOPIC_ID '{forced_id}' not found in topics.json")

              used_ids = {r.get("mpt_id") for r in used_records if isinstance(r, dict)}
              used_titles = {norm(r.get("title")) for r in used_records if isinstance(r, dict)}
              for t in topics:
                  if t["id"] in used_ids or norm(t["title"]) in used_titles:
                      continue
                  return t
              return None


          def validate_topics(topics):
              seen = set()
              for i, t in enumerate(topics, 1):
                  for key in ("id", "title", "script", "terms"):
                      if not t.get(key):
                          raise SystemExit(f"topics.json: topic #{i} has empty '{key}'")
                  if t["id"] in seen:
                      raise SystemExit(f"topics.json: duplicate id {t['id']}")
                  seen.add(t["id"])
                  if re.search(r"[A-Za-z]", t["script"]):
                      raise SystemExit(f"topics.json: script of {t['id']} contains Latin letters")


          # --------------------------------------------------------------- generation
          def mpt_python():
              return os.environ["RUN_PY"]


          def mpt_dir():
              return Path(os.environ["MPT_DIR"])


          def check_cli_supports_flags():
              p = subprocess.run([mpt_python(), "cli.py", "--help"], cwd=mpt_dir(),
                                 capture_output=True, text=True, errors="replace")
              help_text = p.stdout + p.stderr
              missing = [f for f in REQUIRED_CLI_FLAGS if f not in help_text]
              if missing:
                  raise SystemExit("MoneyPrinterTurbo CLI is missing options: " + ", ".join(missing))


          def build_cli_args(topic):
              return [
                  "cli.py",
                  "--video-script", topic["script"],
                  "--video-terms", ",".join(topic["terms"]),
                  "--video-language", "ar-SA",
                  "--voice-name", "ar-SA-HamedNeural",
                  "--font-name", "NotoSansArabic-Regular.ttf",
                  "--subtitle-display-mode", "sentence",
                  "--video-aspect", "9:16",
                  "--video-count", "1",
                  "--bgm-type", "none",
                  "--bgm-volume", "0",
              ]


          def generate_video(topic):
              """يشغّل MoneyPrinterTurbo ويعيد (مسار الفيديو، نص السجل)."""
              started = time.time()
              proc = subprocess.Popen([mpt_python()] + build_cli_args(topic), cwd=mpt_dir(),
                                      stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                                      text=True, errors="replace")
              lines = []
              deadline = started + GENERATION_TIMEOUT
              try:
                  for line in proc.stdout:
                      print(line, end="")
                      lines.append(line)
                      if time.time() > deadline:
                          proc.kill()
                          raise RuntimeError("generation timed out")
              finally:
                  proc.wait()
              if proc.returncode != 0:
                  raise RuntimeError(f"cli.py exited with code {proc.returncode}")

              candidates = [p for p in (mpt_dir() / "storage" / "tasks").glob("*/final-*.mp4")
                            if p.stat().st_mtime >= started - 2]
              if not candidates:
                  raise RuntimeError("no final-*.mp4 was produced")
              return max(candidates, key=lambda p: p.stat().st_mtime), "".join(lines)


          def parse_asset_ids(log_text):
              return list(dict.fromkeys(re.findall(r"asset_id=(\d+)", log_text)))


          # ------------------------------------------------------------------- upload
          def upload_video(video_path, topic, privacy):
              from google.auth.exceptions import RefreshError
              from google.auth.transport.requests import Request
              from google.oauth2.credentials import Credentials
              from googleapiclient.discovery import build
              from googleapiclient.errors import HttpError
              from googleapiclient.http import MediaFileUpload

              creds = Credentials(
                  token=None,
                  refresh_token=os.environ["YOUTUBE_REFRESH_TOKEN"],
                  token_uri="https://oauth2.googleapis.com/token",
                  client_id=os.environ["YOUTUBE_CLIENT_ID"],
                  client_secret=os.environ["YOUTUBE_CLIENT_SECRET"],
                  scopes=["https://www.googleapis.com/auth/youtube.upload"],
              )
              try:
                  creds.refresh(Request())
              except RefreshError as exc:
                  raise RuntimeError("YouTube OAuth refresh failed: " + str(exc)[:200])
              print("OAuth refresh: OK")

              youtube = build("youtube", "v3", credentials=creds, cache_discovery=False)
              title = (topic["title"] + " #shorts")[:100]
              description = (topic["script"] + "\n\n#سيارات #ميكانيكا_السيارات #هندسة #shorts")[:4900]
              body = {
                  "snippet": {
                      "title": title,
                      "description": description,
                      "tags": ["ميكانيكا السيارات", "محرك", "هندسة", "سيارات", "shorts"],
                      "categoryId": "2",  # Autos & Vehicles
                      "defaultLanguage": "ar",
                      "defaultAudioLanguage": "ar",
                  },
                  "status": {"privacyStatus": privacy, "selfDeclaredMadeForKids": False},
              }
              media = MediaFileUpload(str(video_path), mimetype="video/mp4",
                                      chunksize=8 * 1024 * 1024, resumable=True)
              request = youtube.videos().insert(part="snippet,status", body=body, media_body=media)

              response, failures = None, 0
              while response is None:
                  try:
                      status, response = request.next_chunk()
                      if status:
                          print(f"Upload progress: {int(status.progress() * 100)}%")
                  except HttpError as exc:
                      if exc.resp.status in (500, 502, 503, 504) and failures < 5:
                          failures += 1
                          time.sleep(2 ** failures)
                          continue
                      raise RuntimeError(f"YouTube upload failed: HTTP {exc.resp.status}: {str(exc)[:200]}")

              video_id = response.get("id")
              returned = (response.get("status") or {}).get("privacyStatus")
              if not video_id:
                  raise RuntimeError("upload finished but no video id was returned")
              print(f"UPLOAD OK: https://youtu.be/{video_id}  privacy={returned}")
              if returned != privacy:
                  print(f"WARNING: requested privacy '{privacy}' but YouTube reports '{returned}'")
              return video_id


          # ------------------------------------------------------------------- memory
          def remember(topic, video_id, asset_ids):
              used = load_list(USED_CONTENT)
              used.append({
                  "title": topic["title"],
                  "text": topic["script"],
                  "search": ", ".join(topic["terms"]),
                  "fingerprint": [norm(topic["title"]), norm(topic["script"]), norm(" ".join(topic["terms"]))],
                  "video_id": video_id,
                  "saved_at": int(time.time()),
                  "mpt_id": topic["id"],
                  "source": "mpt",
              })
              write_json_atomic(USED_CONTENT, used)

              pexels = load_list(USED_PEXELS)
              known = {str(x) for x in pexels}
              fresh = [a for a in asset_ids if a not in known]
              overlap = len(asset_ids) - len(fresh)
              pexels.extend(fresh)
              write_json_atomic(USED_PEXELS, pexels)
              print(f"Memory saved: {len(used)} content records; "
                    f"{len(fresh)} new Pexels ids ({overlap} had been used before)")


          # --------------------------------------------------------------------- main
          def main():
              privacy = os.environ.get("PRIVACY", "private").strip().lower()
              if privacy not in VALID_PRIVACY:
                  print(f"ERROR: PRIVACY must be one of {VALID_PRIVACY}, got '{privacy}'")
                  return 2

              topics = json.loads(TOPICS_FILE.read_text(encoding="utf-8"))
              validate_topics(topics)
              used = load_list(USED_CONTENT)
              topic = pick_topic(topics, used, os.environ.get("FORCE_TOPIC_ID", "").strip() or None)
              if topic is None:
                  print("ERROR: every topic in topics.json has been used. Add new topics.")
                  return 3
              print(f"Topic: {topic['id']} - {topic['title']}")
              print(f"Privacy mode: {privacy}")

              check_cli_supports_flags()

              video, asset_ids, passed = None, [], False
              for attempt in range(1, MAX_ATTEMPTS + 1):
                  print(f"\n===== Attempt {attempt}/{MAX_ATTEMPTS} =====")
                  try:
                      video, log_text = generate_video(topic)
                  except Exception as exc:
                      print(f"Generation failed: {exc}")
                      continue
                  asset_ids = parse_asset_ids(log_text)
                  passed, report = check_video.check(video, REVIEW_DIR / f"attempt{attempt}")
                  print("\n".join(report))
                  print("QUALITY CHECK:", "PASS" if passed else "FAIL")
                  if passed:
                      break

              if not passed:
                  print("\nERROR: no attempt passed the quality check. Nothing was uploaded "
                        "and no memory was written.")
                  return 1

              OUTPUT_DIR.mkdir(exist_ok=True)
              final_copy = OUTPUT_DIR / "short.mp4"
              shutil.copy2(video, final_copy)

              if privacy == "none":
                  print("\nDry run (PRIVACY=none): skipping upload and memory.")
                  return 0

              for name in ("YOUTUBE_CLIENT_ID", "YOUTUBE_CLIENT_SECRET", "YOUTUBE_REFRESH_TOKEN"):
                  if not os.environ.get(name):
                      print(f"ERROR: secret {name} is missing")
                      return 4

              video_id = upload_video(final_copy, topic, privacy)
              remember(topic, video_id, asset_ids)
              return 0


          if __name__ == "__main__":
              try:
                  sys.exit(main())
              except SystemExit:
                  raise
              except Exception as exc:  # noqa: BLE001
                  print(f"ERROR: {type(exc).__name__}: {exc}")
                  sys.exit(1)
          PYEOF_RUN_DAILY
          cat > mpt_daily/check_video.py <<'PYEOF_CHECK_VIDEO'
          #!/usr/bin/env python3
          """فحص جودة الفيديو قبل النشر.

          الاستعمال:  python check_video.py VIDEO.mp4 [REVIEW_DIR]

          يطبع تقريرًا، ويخرج برمز 0 عند النجاح و1 عند فشل أي فحص أساسي.
          يحفظ في REVIEW_DIR صورة مجمّعة (contact_sheet.jpg) لمراجعتك بالعين.

          ما يفحصه آليًا:
            - الملف قابل للقراءة ومكتمل
            - المدة (15 إلى 59 ثانية)
            - الدقة 1080x1920 ومعدل الإطارات
            - وجود مسار صوت، وعدم كونه صامتًا
            - عدم وجود صمت طويل، وعدم وجود شاشة سوداء طويلة
            - توافق مدة الصوت مع مدة الفيديو
            - ظهور وجوه بشرية (كشف تقريبي، يحجب النشر إذا تكرر)

          ما لا يفحصه آليًا (راجعه بالعين من الصورة المجمّعة):
            - صحة الترجمة العربية وترتيبها
            - صلة اللقطات بالموضوع
          """
          import json
          import re
          import subprocess
          import sys
          from pathlib import Path

          MIN_DURATION = 15.0
          MAX_DURATION = 59.5
          EXPECTED_SIZE = (1080, 1920)
          MIN_MEAN_VOLUME_DB = -35.0
          MAX_SILENCE_SECONDS = 2.5
          MAX_BLACK_SECONDS = 1.0
          MAX_AV_DIFF_SECONDS = 1.5
          FACE_FRAMES_TO_BLOCK = 2


          def run(cmd):
              return subprocess.run(cmd, capture_output=True, text=True, errors="replace")


          def probe(path):
              p = run(["ffprobe", "-v", "error", "-print_format", "json",
                       "-show_format", "-show_streams", str(path)])
              if p.returncode != 0:
                  raise RuntimeError("ffprobe failed: " + p.stderr.strip()[:300])
              return json.loads(p.stdout)


          def decode_whole_file(path):
              """يقرأ الملف كاملًا للتأكد أنه غير تالف."""
              p = run(["ffmpeg", "-v", "error", "-i", str(path), "-f", "null", "-"])
              return p.returncode == 0 and not p.stderr.strip(), p.stderr.strip()[:300]


          def volume_stats(path):
              p = run(["ffmpeg", "-hide_banner", "-i", str(path), "-vn",
                       "-af", "volumedetect", "-f", "null", "-"])
              m = re.search(r"mean_volume:\s*(-?[\d.]+|-inf) dB", p.stderr)
              if not m:
                  return None
              return float("-inf") if m.group(1) == "-inf" else float(m.group(1))


          def longest_silence(path):
              p = run(["ffmpeg", "-hide_banner", "-i", str(path), "-vn",
                       "-af", "silencedetect=noise=-40dB:d=0.8", "-f", "null", "-"])
              durations = [float(x) for x in re.findall(r"silence_duration:\s*([\d.]+)", p.stderr)]
              # صمت ينتهي مع نهاية الملف لا يظهر له silence_duration، فنفحصه أيضًا
              starts = re.findall(r"silence_start:\s*([\d.]+)", p.stderr)
              ends = re.findall(r"silence_end:", p.stderr)
              open_start = float(starts[-1]) if len(starts) > len(ends) else None
              return (max(durations) if durations else 0.0), open_start


          def black_total(path):
              p = run(["ffmpeg", "-hide_banner", "-i", str(path), "-an",
                       "-vf", "blackdetect=d=0.4:pix_th=0.10", "-f", "null", "-"])
              return sum(float(x) for x in re.findall(r"black_duration:([\d.]+)", p.stderr))


          def count_face_frames(path, duration):
              """يأخذ لقطة كل ثانيتين تقريبًا، ويعدّ اللقطات التي ظهر فيها وجه."""
              try:
                  import cv2
              except Exception as exc:  # opencv غير مثبت
                  return None, f"opencv not available ({exc})"

              try:
                  cascade = cv2.CascadeClassifier(
                      cv2.data.haarcascades + "haarcascade_frontalface_default.xml")
                  if cascade.empty():
                      return None, "face cascade file could not be loaded"
              except Exception as exc:
                  return None, f"face detector unavailable ({exc})"
              cap = cv2.VideoCapture(str(path))
              if not cap.isOpened():
                  return None, "cannot open video for sampling"

              face_frames = 0
              t = 1.0
              while t < duration - 0.5:
                  cap.set(cv2.CAP_PROP_POS_MSEC, t * 1000)
                  ok, frame = cap.read()
                  if not ok:
                      break
                  gray = cv2.cvtColor(frame, cv2.COLOR_BGR2GRAY)
                  faces = cascade.detectMultiScale(
                      gray, scaleFactor=1.1, minNeighbors=6, minSize=(90, 90))
                  if len(faces) > 0:
                      face_frames += 1
                  t += 2.0
              cap.release()

              return face_frames, None


          def make_contact_sheet(path, duration, review_dir):
              """صورة مجمّعة من 8 لقطات لمراجعتك بالعين (عبر ffmpeg)."""
              if not review_dir:
                  return
              try:
                  out = Path(review_dir)
                  out.mkdir(parents=True, exist_ok=True)
                  interval = max(1.0, duration / 8.0)
                  run(["ffmpeg", "-v", "error", "-y", "-i", str(path),
                       "-vf", f"fps=1/{interval:.2f},scale=270:480,tile=4x2",
                       "-frames:v", "1", "-q:v", "3", str(out / "contact_sheet.jpg")])
              except Exception as exc:
                  print(f"(could not write contact sheet: {exc})")


          def check(path, review_dir=None):
              """يعيد (نجح؟، قائمة أسطر التقرير)."""
              report = []
              failed = []

              def ok(msg):
                  report.append("PASS  " + msg)

              def bad(msg):
                  report.append("FAIL  " + msg)
                  failed.append(msg)

              def note(msg):
                  report.append("NOTE  " + msg)

              path = Path(path)
              if not path.is_file() or path.stat().st_size == 0:
                  return False, ["FAIL  file missing or empty"]

              try:
                  info = probe(path)
              except Exception as exc:
                  return False, [f"FAIL  unreadable video: {exc}"]

              streams = info.get("streams", [])
              video = next((s for s in streams if s.get("codec_type") == "video"), None)
              audio = next((s for s in streams if s.get("codec_type") == "audio"), None)
              duration = float(info.get("format", {}).get("duration", 0) or 0)
              size_mb = path.stat().st_size / 1e6
              note(f"size {size_mb:.1f} MB, duration {duration:.1f}s")

              if not video:
                  bad("no video stream")
                  return False, report

              width, height = int(video.get("width", 0)), int(video.get("height", 0))
              if (width, height) == EXPECTED_SIZE:
                  ok(f"resolution {width}x{height}")
              else:
                  bad(f"resolution {width}x{height}, expected {EXPECTED_SIZE[0]}x{EXPECTED_SIZE[1]}")

              try:
                  num, den = video.get("avg_frame_rate", "0/1").split("/")
                  fps = float(num) / float(den) if float(den) else 0.0
              except Exception:
                  fps = 0.0
              if 23.0 <= fps <= 61.0:
                  ok(f"frame rate {fps:.1f} fps")
              else:
                  bad(f"frame rate {fps:.1f} fps is not valid")

              if MIN_DURATION <= duration <= MAX_DURATION:
                  ok(f"duration {duration:.1f}s within {MIN_DURATION:.0f}-{MAX_DURATION:.0f}s")
              else:
                  bad(f"duration {duration:.1f}s outside {MIN_DURATION:.0f}-{MAX_DURATION:.0f}s")

              complete, err = decode_whole_file(path)
              if complete:
                  ok("file decodes completely without errors")
              else:
                  bad(f"decode errors: {err}")

              if not audio:
                  bad("no audio stream")
              else:
                  a_dur = float(audio.get("duration", 0) or 0) or duration
                  if abs(a_dur - duration) <= MAX_AV_DIFF_SECONDS:
                      ok(f"audio/video length match ({a_dur:.1f}s vs {duration:.1f}s)")
                  else:
                      bad(f"audio {a_dur:.1f}s vs video {duration:.1f}s differ too much")

                  mean_db = volume_stats(path)
                  if mean_db is None or mean_db < MIN_MEAN_VOLUME_DB:
                      bad(f"audio too quiet or silent (mean volume {mean_db} dB)")
                  else:
                      ok(f"audio level fine (mean {mean_db:.1f} dB)")

                  longest, open_start = longest_silence(path)
                  if longest > MAX_SILENCE_SECONDS:
                      bad(f"silence of {longest:.1f}s inside the video")
                  elif open_start is not None and duration - open_start > MAX_SILENCE_SECONDS:
                      bad(f"silent tail of {duration - open_start:.1f}s at the end")
                  else:
                      ok(f"no long silence (longest {longest:.1f}s)")

              black = black_total(path)
              if black > MAX_BLACK_SECONDS:
                  bad(f"black screen totals {black:.1f}s")
              else:
                  ok(f"no long black screen ({black:.1f}s)")

              make_contact_sheet(path, duration, review_dir)
              face_frames, face_err = count_face_frames(path, duration)
              if face_frames is None:
                  note(f"face check skipped: {face_err}")
              elif face_frames >= FACE_FRAMES_TO_BLOCK:
                  bad(f"faces detected in {face_frames} sampled frames (people are not allowed)")
              elif face_frames == 1:
                  note("face detected in 1 sampled frame (below block threshold; check the contact sheet)")
              else:
                  ok("no faces detected in sampled frames")

              note("subtitle correctness and clip relevance are NOT checked automatically; "
