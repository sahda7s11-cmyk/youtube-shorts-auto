name: Daily MPT Short

# One file contains everything (scripts and topics are embedded as base64). No mpt_daily folder needed.
# New system: MoneyPrinterTurbo + quality check + YouTube upload.
# Disable the old workflow (Daily YouTube Short) in the Actions tab so both do not publish.

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      privacy:
        description: "none = test without upload | private | unlisted | public"
        type: choice
        default: none
        options:
          - none
          - private
          - unlisted
          - public
      topic_id:
        description: "Optional: a specific topic id from topics.json (for example valve-001)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: youtube-shorts-automation
  cancel-in-progress: false

env:
  # Scheduled runs use the repository variable YT_PRIVACY if set (Settings > Variables), else private.
  PRIVACY: ${{ github.event.inputs.privacy || vars.YT_PRIVACY || 'private' }}

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pipeline files (embedded)
        run: |
          set -euo pipefail
          mkdir -p mpt_daily
          decode() {
            # $1 = target file, $2 = expected sha256, base64 data arrives on stdin
            if ! base64 -d > "$1.tmp"; then
              echo "::error::Invalid base64 while writing $1. The workflow text was damaged while pasting it."
              exit 1
            fi
            actual="$(sha256sum "$1.tmp" | cut -d' ' -f1)"
            if [ "$actual" != "$2" ]; then
              echo "::error::$1 was corrupted while pasting the workflow (sha256 mismatch)."
              exit 1
            fi
            mv "$1.tmp" "$1"
            echo "Wrote $1 (sha256 OK)"
          }
          decode mpt_daily/run_daily.py 45b8aabc576ae9085d3a55aa2d3e78e5ad154086b4a5bbffc172c9d01ae33c26 <<'B64_RUN_DAILY'
